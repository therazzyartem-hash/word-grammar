<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Корректор — тесты пунктуации</title>
  <style>
    body { font: 14px/1.5 "Segoe UI", sans-serif; margin: 16px; }
    .fail { color: #b91c1c; } .ok { color: #15803d; } .manual { color: #a16207; }
    li { margin-bottom: 4px; }
  </style>
  <script src="punctuation.js"></script>
</head>
<body>
<h3 id="sum"></h3>
<ol id="out"></ol>
<script>
// [вход, ожидаемый текст после «Исправить все»]; null — правка не нужна.
// Третий элемент 'manual' — ошибка должна показываться, но без автоисправления.
const CASES = [
  // запятые перед союзами
  ['Он сказал что придет завтра.', 'Он сказал, что придет завтра.'],
  ['Я не знаю за что он так.', 'Я не знаю, за что он так.'],
  ['Она ушла потому что устала.', 'Она ушла, потому что устала.'],
  ['Это дом в котором жил Джек.', 'Это дом, в котором жил Джек.'],
  ['Я пришел чтобы помочь.', 'Я пришел, чтобы помочь.'],
  ['Он шел домой хотя было поздно.', 'Он шел домой, хотя было поздно.'],
  ['Она смотрела так будто видела его впервые.', 'Она смотрела так, будто видела его впервые.'],
  ['Он смотрел как будто не узнал.', 'Он смотрел, как будто не узнал.'],
  ['Приходи даже если будет дождь.', 'Приходи, даже если будет дождь.'],
  ['То что он сказал, правда.', 'То, что он сказал, правда.'],
  // вводные слова, пробелы, тире, точка
  ['Конечно он согласился.', 'Конечно, он согласился.'],
  ['К сожалению мы опоздали.', 'К сожалению, мы опоздали.'],
  ['— Конечно пойду.', '— Конечно, пойду.'],
  ['Привет , как дела ?', 'Привет, как дела?'],
  ['Он пришел.Потом ушел.', 'Он пришел. Потом ушел.'],
  ['Да,нет, не знаю.', 'Да, нет, не знаю.'],
  ['Ну,, ладно.', 'Ну, ладно.'],
  ['- Привет, - сказал он.', '— Привет, — сказал он.'],
  ['Мы долго шли по лесу и так и не нашли дорогу домой', 'Мы долго шли по лесу и так и не нашли дорогу домой.'],
  // деепричастные обороты
  ['Вернувшись домой он сразу лёг спать.', 'Вернувшись домой, он сразу лёг спать.'],
  ['Он сидел у окна глядя на дождь.', 'Он сидел у окна, глядя на дождь.'],
  ['Она улыбнулась поправив волосы.', 'Она улыбнулась, поправив волосы.'],
  ['Он вышел из комнаты не сказав ни слова.', 'Он вышел из комнаты, не сказав ни слова.'],
  ['Улыбаясь она протянула руку.', 'Улыбаясь, она протянула руку.'],
  ['Он сидел глядя в окно и думал о ней.', 'Он сидел, глядя в окно, и думал о ней.'],
  ['Она шла по улице напевая песню и улыбалась.', 'Она шла по улице, напевая песню, и улыбалась.'],
  ['Он, оглянувшись по сторонам быстро вошёл.', 'Он, оглянувшись по сторонам, быстро вошёл.'],
  ['Посмотрев на часы мы поняли что опаздываем.', 'Посмотрев на часы, мы поняли, что опаздываем.'],
  ['Арвен стояла у двери держась за ручку.', 'Арвен стояла у двери, держась за ручку.'],
  ['Он шёл рисуя палкой на песке.', 'Он шёл, рисуя палкой на песке.'],
  ['Вернувшись домой мама легла спать.', null, 'manual'],
  ['Сняв пальто она прошла на кухню.', 'Сняв пальто, она прошла на кухню.'],
  ['Не дождавшись ответа он ушёл.', 'Не дождавшись ответа, он ушёл.'],
  ['Он вошёл в комнату улыбаясь.', 'Он вошёл в комнату, улыбаясь.'],
  ['Он встал и оглянувшись по сторонам вышел.', 'Он встал и, оглянувшись по сторонам, вышел.'],
  ['Кошка спавшая на диване проснулась.', 'Кошка, спавшая на диване, проснулась.'],
  ['Женщина стоявшая у входа помахала нам рукой.', 'Женщина, стоявшая у входа, помахала нам рукой.'],
  ['Ветер дувший с моря стих.', 'Ветер, дувший с моря, стих.'],
  ['Она смотрела на детей игравших во дворе и улыбалась.', 'Она смотрела на детей, игравших во дворе, и улыбалась.'],
  // причастные обороты
  ['Девушка сидящая у окна улыбнулась.', 'Девушка, сидящая у окна, улыбнулась.'],
  ['Я увидел девушку сидящую у окна.', 'Я увидел девушку, сидящую у окна.'],
  ['Мальчик читающий книгу не заметил нас.', 'Мальчик, читающий книгу, не заметил нас.'],
  ['Девушка, сидящая у окна улыбнулась.', 'Девушка, сидящая у окна, улыбнулась.'],
  ['Окно выходящее во двор было открыто.', 'Окно, выходящее во двор, было открыто.'],
  ['Мы смотрели на людей идущих по улице.', 'Мы смотрели на людей, идущих по улице.'],
  ['Старик вернувшийся с войны молчал.', 'Старик, вернувшийся с войны, молчал.'],
  ['Девушка сидящая у окна читает книгу.', 'Девушка, сидящая у окна, читает книгу.'],
  ['Солнце уже поднялось над лесом разгоняя остатки тумана.', 'Солнце уже поднялось над лесом, разгоняя остатки тумана.'],
  ['Дождь лил всю ночь не переставая.', 'Дождь лил всю ночь, не переставая.'],
  ['Анна спустилась к реке по узкой тропинке заросшей крапивой.', 'Анна спустилась к реке по узкой тропинке, заросшей крапивой.'],
  ['Мы шли по дороге ведущей к станции.', 'Мы шли по дороге, ведущей к станции.'],
  ['Все молчали ожидая что скажет капитан.', 'Все молчали, ожидая, что скажет капитан.'],
  ['В детстве она пряталась в чулане слушая как взрослые разговаривают.', 'В детстве она пряталась в чулане, слушая, как взрослые разговаривают.'],
  ['Книга которую она читала лежала на подоконнике.', 'Книга, которую она читала, лежала на подоконнике.'],
  ['Человек который пришёл вчера не знал правды.', 'Человек, который пришёл вчера, не знал правды.'],
  ['Дом в котором мы жили стоял у реки.', 'Дом, в котором мы жили, стоял у реки.'],
  // не должно срабатывать
  ['Летняя ночь была тёплой.', null],
  ['Синяя птица сидела на ветке.', null],
  ['Это книга, которую я читал.', null],
  ['Человек, который пришёл и сел рядом, молчал.', null],
  ['Новая жизнь начиналась.', null],
  ['Он сказал, что придет.', null],
  ['Что ты делаешь?', null],
  ['Он что-то сказал.', null],
  ['Ни за что не пойду.', null],
  ['Это не что иное, как обман.', null],
  ['Он устал, так что лёг спать.', null],
  ['Бесконечно долго тянулся день.', null],
  ['Конечно же, он прав.', null],
  ['Хотя бы позвони.', null],
  ['Глава первая', null],
  ['Он пришёл в 2 - 3 часа.', null],
  ['А.С.Пушкин родился в Москве.', null],
  ['Ну что ты, не надо.', null],
  ['Потому что я так решил.', null],
  ['Сидящая у окна девушка улыбнулась.', null],
  ['Я увидел сидящую у окна девушку.', null],
  ['Он ел стоя.', null],
  ['Она была красива и счастлива.', null],
  ['Он был задумчив и молчалив.', null],
  ['На следующий день шёл дождь.', null],
  ['Это был настоящий друг.', null],
  ['Он бежал сломя голову.', null],
  ['В заливе стояли корабли.', null],
  ['Новая книга лежала на столе.', null],
  ['Он работал не покладая рук.', null],
  ['Мы прочитали книгу о героях войны.', null],
  ['Она сделала это, улыбаясь.', null],
  ['Улыбаясь, она протянула руку.', null],
  ['Он молча кивнул.', null],
  ['Спустя час он вернулся.', null],
  ['Благодаря другу он выжил.', null],
];

const apply = (t, ms) => { for (const m of [...ms].sort((a, b) => b.offset - a.offset)) t = t.slice(0, m.offset) + m.repl[0] + t.slice(m.offset + m.length); return t; };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let ok = 0;
const rows = CASES.map(([inp, exp, mode]) => {
  const ms = checkPunctuation(inp);
  const auto = ms.filter(m => m.auto !== false);
  const got = apply(inp, auto);
  const want = exp ?? inp;
  let pass = got === want;
  if (mode === 'manual') pass = pass && ms.some(m => m.auto === false);
  if (pass) ok++;
  const note = ms.filter(m => m.auto === false).map(m => ' [вручную: ' + esc(m.repl[0]) + ']').join('');
  return `<li class="${pass ? 'ok' : 'fail'}">${esc(inp)} → ${esc(got)}${pass ? '' : ' <b>ждали:</b> ' + esc(want)}<span class="manual">${note}</span></li>`;
});
document.getElementById('sum').textContent = `${ok} / ${CASES.length} пройдено`;
document.getElementById('out').innerHTML = rows.join('');

// Контроль на правильном тексте, под который правила не подгонялись:
// 1) на нём не должно быть срабатываний; 2) если убрать все запятые — сколько вернём
const CONTROL = [
  'Капитан стоял на мостике, всматриваясь в горизонт.',
  'Матросы, уставшие после долгой вахты, спали в кубрике.',
  'Корабль медленно входил в гавань, окутанную утренним туманом.',
  'Добравшись до берега, путники развели костёр.',
  'Старуха сидела у печи, перебирая чётки.',
  'Мальчик, прятавшийся за забором, громко чихнул.',
  'Он долго не мог уснуть, ворочаясь с боку на бок.',
  'Письмо, которое она получила утром, было от брата.',
  'Город, в котором он родился, сильно изменился.',
  'Ничего не ответив, она отвернулась к окну.',
  'Лошади шли шагом, понурив головы.',
  'Гости, приехавшие из столицы, привезли подарки.',
  'Она перечитала записку, стараясь понять её смысл.',
  'Тропинка, ведущая к озеру, заросла травой.',
  'Отложив книгу, он подошёл к двери.',
  'Мы долго смотрели на огни, мерцавшие вдали.',
  'Птицы, летевшие на юг, кружили над полем.',
  'Он шёл быстро, почти бежал.',
  'Охотник остановился, прислушиваясь к шорохам леса.',
  'Девочка, которую все считали тихоней, вдруг запела.',
  'Вечером отец рассказывал истории о море.',
  'Тёплый ветер шевелил занавески.',
  'Мы приехали в деревню рано утром.',
  'Её голос звучал устало и тихо.',
  'На столе стояла ваза с увядшими розами.',
  'Он открыл дверь и вошёл в тёмную комнату.',
  'Учитель объяснял новую тему, а ученики записывали.',
  'Зимой здесь бывает очень холодно.',
  'Сестра работала в больнице медсестрой.',
  'Собака лежала у порога и дремала.',
  'Утро выдалось холодным. Над рекой стелился густой туман, и деревья на том берегу казались призраками.',
  'Бабушка уже возилась у плиты, напевая что-то себе под нос.',
  '— Доброе утро, — сказала Анна, садясь за стол.',
  'Отец так и не позвонил, хотя обещал.',
  'Она знала, что он занят, но всё равно было обидно.',
  'В детстве она часто пряталась в чулане, слушая, как взрослые разговаривают внизу.',
  'Анна спустилась к реке по узкой тропинке, заросшей крапивой.',
  'Пожилой мужчина, опираясь на трость, медленно перешёл улицу.',
  'Новая жизнь начиналась медленно.',
  'Красная машина остановилась у дома.',
];
// все ли вставленные знаки есть в оригинале (лишних запятых не поставили)
const isSubseq = (a, b) => { let j = 0; for (const c of b) if (c === a[j]) j++; return j === a.length; };
let fp = 0, good = 0, manualN = 0, wrongN = 0, total = 0;
const crows = [];
for (const s of CONTROL) {
  const own = checkPunctuation(s);
  if (own.length) { fp++; crows.push(`<li class="fail">Ложное срабатывание: ${esc(s)} → ${own.map(m => esc(m.repl[0])).join(' | ')}</li>`); }
  if (!s.includes(',')) continue;
  total++;
  const broken = s.replace(/,/g, '');
  const ms = checkPunctuation(broken);
  const fixed = apply(broken, ms.filter(m => m.auto !== false));
  if (fixed === s) good++;
  else if (isSubseq(fixed, s)) {
    if (ms.some(m => m.auto === false)) manualN++;
    crows.push(`<li class="manual">${fixed === broken ? 'Не восстановлено' : 'Частично'}: ${esc(fixed)}</li>`);
  } else { wrongN++; crows.push(`<li class="fail">Неверно: ${esc(fixed)}</li>`); }
}
document.body.insertAdjacentHTML('beforeend', `<h3 id="ctl">Контроль: ложных срабатываний ${fp} из ${CONTROL.length}; ` +
  `запятые восстановлены ${good} из ${total} (вручную ${manualN}, неверно ${wrongN})</h3><ul>${crows.join('')}</ul>`);
</script>
</body>
</html>
